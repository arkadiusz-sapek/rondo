services:
  db:
    image: postgres:17-alpine
    container_name: rondo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rondo
      POSTGRES_PASSWORD: rondo
      POSTGRES_DB: rondo
    ports:
      - '5434:5432'
    volumes:
      - rondo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rondo']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  rondo-pgdata:
